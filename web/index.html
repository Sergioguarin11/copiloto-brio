<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Copiloto Brío</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --verde: #0B6B55;
    --verde-osc: #084C3D;
    --yema: #FFC93C;
    --fondo: #EFE7DC;
    --doodle: #E3D8C9;
    --bot: #FFFFFF;
    --yo: #D8F6C8;
    --tinta: #1D2B2A;
    --suave: #5F6F6C;
    --azul: #1A9BD7;
    --rojo: #D9452B;
    --rojo-suave: #FDE3DE;
    --sube: #1E9A5B;
    --sube-suave: #DDF5E7;
    --chip: #FFFFFF;
    --linea: #E4DED4;
    --tarjeta: #F6F1EA;
    --foco: #1F6FB2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --verde: #1F7A63; --verde-osc: #145646; --fondo: #0D1714; --doodle: #16231F; --bot: #1D2A27; --yo: #1F4A38;
      --tinta: #E9EFEC; --suave: #A3B4AF; --azul: #53BDEB; --rojo: #FF7B63; --rojo-suave: #3A1D18; --sube: #4FD08E; --sube-suave: #173527;
      --chip: #1D2A27; --linea: #2C3B37; --tarjeta: #15201D; --foco: #7DB8EA;
    }
  }
  :root[data-theme="dark"] {
    --verde: #1F7A63; --verde-osc: #145646; --fondo: #0D1714; --doodle: #16231F; --bot: #1D2A27; --yo: #1F4A38;
    --tinta: #E9EFEC; --suave: #A3B4AF; --azul: #53BDEB; --rojo: #FF7B63; --rojo-suave: #3A1D18; --sube: #4FD08E; --sube-suave: #173527;
    --chip: #1D2A27; --linea: #2C3B37; --tarjeta: #15201D; --foco: #7DB8EA;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--tinta); font: 17px/1.45 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--verde-osc); }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 8px; }

  .telefono { height: 100vh; max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; background-color: var(--fondo);
    background-image: radial-gradient(var(--doodle) 2px, transparent 2.5px), radial-gradient(var(--doodle) 1.5px, transparent 2px);
    background-size: 34px 34px, 22px 22px; background-position: 0 0, 11px 17px; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--verde); color: #fff; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--yema); display: grid; place-items: center; font-size: 26px; flex: none; }
  .quien { flex: 1; min-width: 0; }
  .quien b { display: block; font-size: 19px; font-weight: 900; line-height: 1.15; }
  .quien span { font-size: 14px; opacity: .9; }
  .demo { font-size: 13px; font-weight: 800; background: rgba(255,255,255,.16); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .nueva { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; background: rgba(255,255,255,.16); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .nueva:hover { background: rgba(255,255,255,.26); }

  #log { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 14px 8px; }
  .chat { display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; }
  .dia { align-self: center; font-size: 13px; font-weight: 800; color: var(--suave); background: var(--bot); padding: 4px 12px; border-radius: 8px; box-shadow: 0 1px 1px rgba(0,0,0,.08); }

  .msg { max-width: min(560px, 88%); padding: 9px 12px 6px; border-radius: 14px; box-shadow: 0 1px 1.5px rgba(0,0,0,.12); overflow-wrap: anywhere; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-top-left-radius: 4px; }
  .msg.yo { align-self: flex-end; background: var(--yo); border-top-right-radius: 4px; }
  .msg.error { border-left: 4px solid var(--rojo); }
  .msg p { margin: 0 0 6px; }
  .msg ul { margin: 2px 0 6px; padding-left: 20px; }
  .msg .fuente-txt { display: none; }
  .hora { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 12px; color: var(--suave); margin-top: 2px; }
  .checks { color: var(--azul); font-weight: 900; letter-spacing: -3px; margin-right: 3px; }

  .tarjeta { margin: 4px -4px 8px; background: var(--tarjeta); border-radius: 12px; padding: 12px 14px; }
  .tarjeta .tema { font-size: 14px; font-weight: 800; color: var(--suave); }
  .tarjeta .grande { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin: 2px 0; }
  .tarjeta .emoji { font-size: 34px; line-height: 1; }
  .tarjeta .numero { font-size: clamp(30px, 7vw, 42px); font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .pill { font-size: 18px; font-weight: 900; padding: 4px 11px; border-radius: 999px; }
  .pill.baja { color: var(--rojo); background: var(--rojo-suave); }
  .pill.sube { color: var(--sube); background: var(--sube-suave); }
  .tarjeta .contra { font-size: 14px; color: var(--suave); }
  .filas { display: grid; gap: 7px; margin-top: 10px; }
  .fila { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 15px; }
  .fila .barra { grid-column: 1 / -1; height: 9px; border-radius: 6px; background: var(--linea); overflow: hidden; }
  .fila .barra i { display: block; height: 100%; border-radius: 6px; background: var(--verde); }
  .fila.peor .barra i { background: var(--rojo); }
  .fila .v { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fila.peor .v, .fila.peor .n { color: var(--rojo); font-weight: 900; }
  .cita { margin: 4px -4px 8px; background: var(--tarjeta); border-left: 4px solid var(--yema); border-radius: 10px; padding: 9px 12px; font-size: 15px; }
  .cita small { display: block; color: var(--suave); margin-top: 4px; font-size: 13px; }

  .estado { display: inline-flex; align-items: center; font-size: 13px; font-weight: 800; color: var(--azul); }
  .estado.mal { color: var(--rojo); }
  .origen { font-size: 14px; font-weight: 800; color: var(--verde); margin-top: 2px; }
  .origen[aria-expanded="true"] { text-decoration: underline; text-underline-offset: 3px; }
  .rastro { margin: 8px -4px 4px; border-top: 1px dashed var(--linea); padding-top: 8px; font-size: 14px; display: grid; gap: 6px; }
  .rastro .p { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
  .rastro .p i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--verde); color: #fff; font-weight: 900; font-size: 13px; }
  .rastro .p.mal i { background: var(--rojo); }
  .rastro .p span { color: var(--suave); }

  .reacciones { display: flex; gap: 6px; margin: -2px 0 0 6px; }
  .reacciones button { font-size: 13px; font-weight: 800; background: var(--bot); border-radius: 999px; padding: 3px 10px; box-shadow: 0 1px 1.5px rgba(0,0,0,.1); color: var(--suave); }
  .reacciones button[aria-pressed="true"] { color: var(--tinta); outline: 2px solid var(--verde); }

  .rapidas { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 6px; max-width: 640px; }
  .rapida { background: var(--chip); color: var(--verde); font-weight: 800; font-size: 15px; padding: 9px 14px; border-radius: 999px; border: 2px solid var(--verde); box-shadow: 0 1px 1.5px rgba(0,0,0,.1); text-align: left; }
  .rapida:hover { background: var(--verde); color: #fff; }

  .escribiendo { align-self: flex-start; background: var(--bot); border-radius: 14px; border-top-left-radius: 4px; padding: 10px 14px; box-shadow: 0 1px 1.5px rgba(0,0,0,.12); display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--suave); }
  .puntos { display: inline-flex; gap: 4px; }
  .puntos i { width: 8px; height: 8px; border-radius: 50%; background: var(--suave); animation: salta 1.2s infinite; }
  .puntos i:nth-child(2) { animation-delay: .15s; } .puntos i:nth-child(3) { animation-delay: .3s; }
  @keyframes salta { 0%, 60%, 100% { transform: none; opacity: .5 } 30% { transform: translateY(-5px); opacity: 1 } }
  .entra { animation: aparece .25s ease-out; }
  @keyframes aparece { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  form { display: flex; gap: 8px; align-items: flex-end; padding: 8px 12px 12px; max-width: 744px; width: 100%; margin: 0 auto; }
  .caja { flex: 1; background: var(--bot); border-radius: 26px; padding: 4px 18px; box-shadow: 0 1px 1.5px rgba(0,0,0,.12); display: flex; }
  textarea { flex: 1; resize: none; border: 0; outline: 0; font: inherit; background: transparent; color: var(--tinta); padding: 10px 0; min-height: 44px; max-height: 140px; }
  .enviar { width: 52px; height: 52px; border-radius: 50%; background: var(--verde); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .enviar:disabled { opacity: .55; cursor: default; }
  .enviar svg { width: 24px; height: 24px; }

  @media (max-width: 560px) {
    .demo { display: none; }
    .nueva span { display: none; }
    .msg { max-width: 92%; }
  }
  @media (prefers-reduced-motion: reduce) { .puntos i, .entra { animation: none; } }
</style>
</head>
<body>
<div class="telefono">
  <header>
    <div class="avatar" aria-hidden="true">🥫</div>
    <div class="quien"><b>Copiloto Brío</b><span id="estado-linea">en línea · responde con cifras verificadas</span></div>
    <span class="demo" title="La tabla de ventas y los estudios son sintéticos, creados para la prueba">Datos de demostración</span>
    <button class="nueva" id="nueva" type="button" aria-label="Nueva conversación">⟳ <span>Nueva</span></button>
  </header>

  <div id="log" aria-live="polite"><div class="chat" id="chat"></div></div>

  <form id="form">
    <div class="caja"><textarea id="input" rows="1" aria-label="Escribe tu pregunta" placeholder="Escribe tu pregunta…"></textarea></div>
    <button class="enviar" id="enviar" type="submit" aria-label="Enviar pregunta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5l18-8.5L3 3.5l2.5 7L15 12l-9.5 1.5z" fill="currentColor"/></svg></button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id)
const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
}
let sessionId = store.get("sessionId") || crypto.randomUUID()
store.set("sessionId", sessionId)
let accessKey = store.get("accessKey") || ""
let turno = 0

const INICIALES = [
  "💰 ¿Cuánto vendimos este trimestre?",
  "📍 ¿Qué región cayó más?",
  "🛒 ¿Cómo van los canales este año?",
  "🧾 ¿Por qué los reportes no cuadran?",
  "📚 ¿Qué dicen los estudios del precio?",
]
const PREGUNTA_REAL = {
  "💰 ¿Cuánto vendimos este trimestre?": "¿Cuánto vendió Brío en ventas netas en el tercer trimestre de 2026 frente al mismo trimestre de 2025?",
  "📍 ¿Qué región cayó más?": "¿Qué región cayó más en ventas netas en el tercer trimestre de 2026 frente al de 2025?",
  "🛒 ¿Cómo van los canales este año?": "¿Cómo cambiaron las ventas netas por canal de enero a septiembre de 2026 frente al mismo periodo de 2025?",
  "🧾 ¿Por qué los reportes no cuadran?": "¿Por qué el reporte de Comercial y el de Finanzas dan cifras distintas de ventas netas en 2025?",
  "📚 ¿Qué dicen los estudios del precio?": "¿Qué dicen los estudios internos sobre el precio en el canal tradicional?",
}
const METRICA = { ventas_netas: "Ventas netas", ventas_brutas: "Ventas brutas", descuentos: "Descuentos", devoluciones: "Devoluciones", unidades: "Unidades vendidas", descuento_pct: "Descuento sobre ventas brutas" }
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"]
const mes = (m) => (m ? `${MESES[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}` : "")
const periodo = (d, h) => (d === h ? mes(d) : `${mes(d)} a ${mes(h)}`)
const horaDe = (ts) => { try { return new Date(ts || Date.now()).toLocaleTimeString("es-CO", { hour: "numeric", minute: "2-digit" }) } catch { return "" } }

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(accessKey ? { "x-access-key": accessKey } : {}) }
  const res = await fetch(path, { ...opts, headers })
  if (res.status === 401) {
    accessKey = prompt("Este copiloto requiere una clave de acceso:") || ""
    store.set("accessKey", accessKey)
    if (accessKey) return api(path, opts)
  }
  return res
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])

function md(texto) {
  const inline = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "$1")
  const out = []
  let lista = null
  const cerrar = () => { if (lista) { out.push(`<ul>${lista.join("")}</ul>`); lista = null } }
  for (const linea of String(texto).split("\n")) {
    const m = linea.match(/^\s*[-*•]\s+(.*)/) || linea.match(/^\s*\d+[.)]\s+(.*)/)
    if (m) { (lista ||= []).push(`<li>${inline(m[1])}</li>`); continue }
    cerrar()
    if (/^\s*-{3,}\s*$/.test(linea) || !linea.trim()) continue
    // La fuente se muestra en "De dónde salió", no repetida en el texto
    out.push(`<p${/^\s*fuente:/i.test(linea) ? ' class="fuente-txt"' : ""}>${inline(linea.replace(/^#+\s*/, ""))}</p>`)
  }
  cerrar()
  return out.join("")
}

const datos = (t) => (t && t.ok && t.resultado && t.resultado.data) || null
const signo = (s) => (String(s || "").trim().startsWith("-") ? "baja" : "sube")
const menos = (s) => String(s || "").replace("-", "−")

// La tarjeta se arma con lo que devolvió la base, no con el texto de la IA.
function tarjetas(toolCalls) {
  let html = ""
  for (const t of toolCalls || []) {
    const d = datos(t)
    if (!d) continue
    if (t.nombre === "brio_consultar_ventas") {
      const tot = d.total
      const filtros = [d.filtros.canal && `canal ${d.filtros.canal}`, d.filtros.region && `región ${d.filtros.region}`].filter(Boolean).join(", ")
      let filas = ""
      if (d.filas.length > 1) {
        const conVar = d.filas.every((f) => typeof f.variacion === "number")
        const max = Math.max(...d.filas.map((f) => Math.abs(conVar ? f.variacion : f.valor))) || 1
        const peor = conVar ? d.filas.reduce((a, b) => (b.variacion < a.variacion ? b : a)) : null
        filas = `<div class="filas">${d.filas.map((f) => {
          const v = conVar ? f.variacion : f.valor
          const esPeor = peor && f === peor && f.variacion < 0
          return `<div class="fila${esPeor ? " peor" : ""}"><span class="n">${esPeor ? "🔻 " : ""}${esc(f.grupo)}</span><span class="v">${conVar ? esc(menos(f.variacion_fmt)) : esc(f.valor_fmt)}</span>
            <span class="barra"><i style="width:${Math.max(4, (Math.abs(v) / max) * 100)}%"></i></span></div>`
        }).join("")}</div>`
      }
      html += `<div class="tarjeta">
        <div class="tema">${esc(METRICA[d.metrica] || d.metrica)} · ${esc(periodo(d.periodo.desde, d.periodo.hasta))}${filtros ? ` · ${esc(filtros)}` : ""}</div>
        <div class="grande"><span class="emoji" aria-hidden="true">${tot.variacion_fmt ? (signo(tot.variacion_fmt) === "baja" ? "📉" : "📈") : "📊"}</span><span class="numero">${esc(tot.valor_fmt)}</span>
          ${tot.variacion_fmt ? `<span class="pill ${signo(tot.variacion_fmt)}">${esc(menos(tot.variacion_fmt))}</span>` : ""}</div>
        ${tot.comparado_fmt ? `<div class="contra">Antes: ${esc(tot.comparado_fmt)} (${esc(periodo(d.periodo_comparado.desde, d.periodo_comparado.hasta))})</div>` : ""}
        ${filas}</div>`
    }
    if (t.nombre === "brio_definicion" && d.comparacion) {
      const max = Math.max(...d.comparacion.map((c) => c.valor))
      html += `<div class="tarjeta"><div class="tema">🧾 “Ventas netas” según cada reporte · ${esc(periodo(d.periodo.desde, d.periodo.hasta))}</div>
        <div class="filas">${d.comparacion.map((c) => `<div class="fila${c.id === "finanzas" ? "" : " peor"}"><span class="n">${c.id === "finanzas" ? "✅ " : ""}${esc(c.reporte.replace(" (definición única)", ""))}</span><span class="v">${esc(c.valor_fmt)}</span>
          <span class="barra"><i style="width:${(c.valor / max) * 100}%"></i></span></div>`).join("")}</div>
        <div class="contra" style="margin-top:8px">La cifra única: ${esc(d.definicion_unica.formula)}</div></div>`
    }
    if (t.nombre === "brio_buscar_estudios") {
      html += d.fragmentos.map((f) => `<div class="cita">“${esc(f.texto)}”<small>📚 ${esc(f.estudio)}</small></div>`).join("")
    }
  }
  return html
}

function rastro(ev) {
  const calls = ev.toolCalls || []
  const ficha = calls.map(datos).find((d) => d && d.ficha)?.ficha
  const v = ev.verificacion || { cifras: 0, no_verificadas: [] }
  const malas = (v.no_verificadas || []).length
  const que = calls.map((t) => {
    const a = t.args || {}
    if (t.nombre === "brio_consultar_ventas") {
      const por = { mes: ", mes a mes", trimestre: ", por trimestre", anio: ", por año", canal: ", por canal", region: ", por región" }[a.agrupar_por] || ""
      const filtros = [a.canal && `, canal ${a.canal}`, a.region && `, región ${a.region}`].filter(Boolean).join("")
      const comp = a.comparar_con === "mismo_periodo_anio_anterior" ? ", frente al año anterior" : a.comparar_con === "periodo_anterior" ? ", frente al periodo anterior" : ""
      return `${METRICA[a.metrica] || a.metrica} de ${periodo(a.desde, a.hasta)}${por}${filtros}${comp}`
    }
    if (t.nombre === "brio_definicion") return "Cómo calcula cada reporte las ventas netas"
    if (t.nombre === "brio_buscar_estudios") return `Estudios internos sobre “${a.consulta}”`
    return "Qué datos hay disponibles"
  })
  const p = (n, b, s, mal) => `<div class="p${mal ? " mal" : ""}"><i>${n}</i><div><b>${b}</b><br><span>${s}</span></div></div>`
  return `<div class="rastro">
    ${p(1, "Entendí tu pregunta", calls.length ? "y busqué en la base de ventas" : "y respondí sin consultar la base")}
    ${p(2, "Consulté", esc(que.join(" · ") || "nada"))}
    ${p(3, "La base hizo las cuentas", "Yo no calculo: copio lo que la base devuelve")}
    ${p(4, malas ? "Ojo con estas cifras" : "Revisé cada cifra", malas ? esc(v.no_verificadas.join(", ")) + " no salen de los datos" : v.cifras ? `Las ${v.cifras} coinciden con los datos` : "No había cifras que revisar", malas)}
    ${ficha ? `<span style="color:var(--suave)">Fuente: base única de ventas de Brío · corte ${esc(ficha.corte)} · ${esc(ficha.metrica)} = ${esc(ficha.definicion)} · valida ${esc(ficha.responsable_validacion)}</span>` : ""}
  </div>`
}

// Botones de respuesta rápida según lo que se acaba de consultar
function sugerencias(ev) {
  const t = (ev.toolCalls || []).find((x) => x.ok)
  if (!t) return INICIALES.slice(0, 2)
  const a = t.args || {}
  const per = a.desde ? `de ${periodo(a.desde, a.hasta)}` : ""
  if (t.nombre === "brio_consultar_ventas") {
    const out = []
    if (a.agrupar_por !== "region") out.push(`📍 ¿Y por región, ${per}?`)
    if (a.agrupar_por !== "canal") out.push(`🛒 ¿Y por canal, ${per}?`)
    if (a.agrupar_por !== "mes") out.push(`📅 ¿Mes a mes, ${per}?`)
    out.push("📚 ¿Qué dicen los estudios?")
    return out.slice(0, 3)
  }
  if (t.nombre === "brio_definicion") return ["💰 ¿Cuánto vendimos en 2025?", "📍 ¿Qué región cayó más?"]
  if (t.nombre === "brio_buscar_estudios") return ["🛒 ¿Cuánto cayó el canal tradicional este año?", "📍 ¿Qué región cayó más?"]
  return INICIALES.slice(0, 2)
}

function rapidas(lista) {
  const div = document.createElement("div")
  div.className = "rapidas entra"
  lista.forEach((q) => {
    const b = document.createElement("button")
    b.type = "button"; b.className = "rapida"; b.textContent = q
    b.onclick = () => enviar(PREGUNTA_REAL[q] || q.replace(/^\S+\s/, ""), q)
    div.appendChild(b)
  })
  $("chat").appendChild(div)
}

function burbujaYo(texto, ts) {
  const div = document.createElement("div")
  div.className = "msg yo entra"
  div.innerHTML = `<div>${esc(texto)}</div><div class="hora">${horaDe(ts)} <span class="checks">✓✓</span></div>`
  $("chat").appendChild(div)
}

function burbujaBot(ev, conSugerencias) {
  const idx = ++turno
  const v = ev.verificacion || { cifras: 0, no_verificadas: [] }
  const malas = (v.no_verificadas || []).length
  const estado = ev.error || !v.cifras ? "" : malas ? `<span class="estado mal">⚠️ revisar cifras</span>` : `<span class="estado"><span class="checks">✓✓</span>cifras verificadas</span>`
  const div = document.createElement("div")
  div.className = "msg bot entra" + (ev.error ? " error" : "")
  div.innerHTML = `${md(ev.texto || "")}${tarjetas(ev.toolCalls)}
    ${ev.error ? "" : `<button type="button" class="origen" aria-expanded="false">ℹ️ De dónde salió</button><div class="caja-rastro" hidden></div>`}
    <div class="hora">${estado}<span>${horaDe(ev.ts)}</span></div>`
  const btn = div.querySelector(".origen")
  if (btn) btn.onclick = () => {
    const c = div.querySelector(".caja-rastro")
    const abrir = c.hidden
    c.hidden = !abrir
    c.innerHTML = abrir ? rastro(ev) : ""
    btn.setAttribute("aria-expanded", String(abrir))
  }
  $("chat").appendChild(div)
  if (!ev.error) {
    const r = document.createElement("div")
    r.className = "reacciones"
    r.innerHTML = `<button type="button" data-u="1" aria-pressed="false">👍 Me sirvió</button><button type="button" data-u="0" aria-pressed="false">👎 Tiene un error</button>`
    r.querySelectorAll("button").forEach((b) => (b.onclick = async () => {
      r.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"))
      b.setAttribute("aria-pressed", "true")
      const util = b.dataset.u === "1"
      const comentario = util ? "" : (prompt("¿Qué estaba mal? Nos ayuda a corregirlo.") || "")
      try { await api("/api/feedback", { method: "POST", body: JSON.stringify({ sessionId, indice: idx, util, comentario }) }) } catch {}
    }))
    $("chat").appendChild(r)
  }
  if (conSugerencias) rapidas(sugerencias(ev))
}

function bienvenida() {
  const d = document.createElement("div")
  d.className = "dia"; d.textContent = "Hoy"
  $("chat").appendChild(d)
  const div = document.createElement("div")
  div.className = "msg bot entra"
  div.innerHTML = `<p>¡Hola! 👋 Soy el copiloto de <b>Brío</b>.</p>
    <p>Pregúntame por ventas, regiones, canales o estudios. Te respondo con la cifra exacta y te muestro de dónde salió.</p>
    <p>Cuando veas <span class="checks" style="font-size:16px">✓✓</span> <b>en azul</b>, la cifra está verificada contra los datos.</p>
    <div class="hora"><span>${horaDe()}</span></div>`
  $("chat").appendChild(div)
  rapidas(INICIALES)
}

let ocupado = false
async function enviar(texto, mostrado) {
  if (ocupado || !texto.trim()) return
  ocupado = true
  $("enviar").disabled = true
  document.querySelectorAll(".rapidas").forEach((n) => n.remove())
  burbujaYo(mostrado || texto)
  const espera = document.createElement("div")
  espera.className = "escribiendo"
  espera.innerHTML = `<span class="puntos"><i></i><i></i><i></i></span> Brío está consultando la base…`
  $("chat").appendChild(espera)
  $("estado-linea").textContent = "escribiendo…"
  $("log").scrollTop = $("log").scrollHeight
  try {
    const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ sessionId, message: texto }) })
    const data = await res.json()
    espera.remove()
    if (!res.ok) burbujaBot({ texto: data.error || "No pude procesar la pregunta. Vuelve a enviarla.", error: true }, false)
    else burbujaBot({ texto: data.reply, toolCalls: data.toolCalls, verificacion: data.verificacion, error: data.error }, true)
  } catch {
    espera.remove()
    burbujaBot({ texto: "No hay conexión con el servidor. Revisa tu internet y vuelve a enviar la pregunta.", error: true }, false)
  } finally {
    $("estado-linea").textContent = "en línea · responde con cifras verificadas"
    ocupado = false
    $("enviar").disabled = false
    $("log").scrollTop = $("log").scrollHeight
    $("input").focus()
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; enviar(t) }
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit() } })
$("nueva").onclick = () => { store.set("sessionId", crypto.randomUUID()); location.reload() }

async function iniciar() {
  let historial = []
  try {
    const rs = await api(`/api/sessions/${sessionId}`)
    if (rs.ok) historial = (await rs.json()).historial
  } catch {}
  bienvenida()
  if (historial.length) {
    document.querySelectorAll(".rapidas").forEach((n) => n.remove())
    historial.forEach((ev, i) => (ev.rol === "usuario" ? burbujaYo(ev.texto, ev.ts) : burbujaBot(ev, i === historial.length - 1)))
    $("log").scrollTop = $("log").scrollHeight
  }
}
iniciar()
</script>
