<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Copiloto Brío</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet" />
<style>
  :root {
    --papel: #F5F7F4;
    --hoja: #FFFFFF;
    --tinta: #14303A;
    --suave: #56707A;
    --linea: #DCE4E0;
    --yema: #F2A007;
    --yema-suave: #FDF0D2;
    --verde: #2F7D5B;
    --verde-suave: #E2F1E9;
    --rojo: #C2412D;
    --rojo-suave: #FBE6E2;
    --panel: #E8EEEA;
    --foco: #1F6FB2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #0F1E24; --hoja: #16282F; --tinta: #E6EEEB; --suave: #9DB3B9; --linea: #27414A;
      --yema: #F5B43A; --yema-suave: #3A3018; --verde: #5DBE8E; --verde-suave: #183A2C;
      --rojo: #F07A66; --rojo-suave: #3D1E19; --panel: #1B3038; --foco: #7DB8EA;
    }
  }
  :root[data-theme="dark"] {
    --papel: #0F1E24; --hoja: #16282F; --tinta: #E6EEEB; --suave: #9DB3B9; --linea: #27414A;
    --yema: #F5B43A; --yema-suave: #3A3018; --verde: #5DBE8E; --verde-suave: #183A2C;
    --rojo: #F07A66; --rojo-suave: #3D1E19; --panel: #1B3038; --foco: #7DB8EA;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 17px/1.55 "Atkinson Hyperlegible", system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 6px; }
  .display { font-family: "Bricolage Grotesque", system-ui, sans-serif; }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-bottom: 1px solid var(--linea); background: var(--hoja); }
  .marca { display: flex; align-items: center; gap: 10px; }
  .gota { width: 26px; height: 26px; border-radius: 50% 50% 50% 8px; background: var(--yema); transform: rotate(-45deg); }
  .marca h1 { margin: 0; font: 800 21px/1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.01em; }
  .sintetico { font-size: 14px; color: var(--suave); border: 1px dashed var(--suave); border-radius: 999px; padding: 2px 10px; }
  header .espacio { flex: 1; }
  .modelo { font-size: 14px; color: var(--suave); }
  .nueva { font-size: 15px; font-weight: 700; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--linea); background: var(--papel); }
  .nueva:hover { border-color: var(--suave); }

  main { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 28px 28px 12px; }
  .columna { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

  .pregunta { align-self: flex-end; max-width: 80%; background: var(--tinta); color: var(--papel); padding: 11px 17px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; }

  .respuesta { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .cifra, .cita, .texto { min-width: 0; overflow-wrap: anywhere; }
  .respuesta.activa { position: relative; }
  .texto p { margin: 0 0 8px; } .texto p:last-child { margin: 0; }
  .texto ul { margin: 4px 0 8px; padding-left: 20px; } .texto li { margin: 3px 0; }
  .texto .fuente { font-size: 14px; color: var(--suave); }
  .respuesta.error .texto { color: var(--rojo); }

  /* La pieza memorable: la cifra verificada */
  .cifra { background: var(--hoja); border: 1px solid var(--linea); border-radius: 18px; padding: 20px 22px 18px; display: grid; gap: 10px; }
  .cifra .que { font-size: 15px; color: var(--suave); }
  .cifra .fila { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; }
  .cifra .numero { font: 800 clamp(34px, 6vw, 52px)/1 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; background: linear-gradient(transparent 68%, var(--yema-suave) 68%); padding: 0 4px; }
  .variacion { font: 700 20px/1 "Bricolage Grotesque", system-ui, sans-serif; padding: 6px 12px; border-radius: 999px; }
  .variacion.baja { color: var(--rojo); background: var(--rojo-suave); }
  .variacion.sube { color: var(--verde); background: var(--verde-suave); }
  .cifra .contra { font-size: 15px; color: var(--suave); }

  .barras { display: grid; gap: 8px; margin-top: 4px; }
  .barra { display: grid; grid-template-columns: minmax(110px, 190px) 1fr auto; align-items: center; gap: 12px; font-size: 15px; }
  .barra .pista { height: 12px; background: var(--panel); border-radius: 6px; overflow: hidden; }
  .barra .relleno { height: 100%; border-radius: 6px; background: var(--tinta); opacity: .85; }
  .barra.peor .relleno { background: var(--rojo); opacity: 1; }
  .barra .val { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .barra .val b { font-weight: 700; }
  .barra.peor .val b { color: var(--rojo); }

  .cita { border-left: 4px solid var(--yema); background: var(--hoja); border-radius: 0 12px 12px 0; padding: 12px 16px; }
  .cita q { quotes: "“" "”"; }
  .cita small { display: block; margin-top: 6px; font-size: 14px; color: var(--suave); }

  .pie { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .sello { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
  .sello.ok { color: var(--verde); background: var(--verde-suave); }
  .sello.mal { color: var(--rojo); background: var(--rojo-suave); }
  .sello svg { width: 16px; height: 16px; flex: none; }
  .ver-rastro { font-size: 15px; color: var(--foco); text-decoration: underline; text-underline-offset: 3px; }
  .fb { display: inline-flex; gap: 6px; margin-left: auto; }
  .fb button { font-size: 14px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--linea); color: var(--suave); }
  .fb button:hover { color: var(--tinta); border-color: var(--suave); }
  .fb button[aria-pressed="true"] { color: var(--tinta); background: var(--panel); border-color: var(--tinta); }

  .esperando { display: flex; align-items: center; gap: 10px; color: var(--suave); font-size: 15px; }
  .esperando .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--yema); animation: latido 1s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(.5); opacity: .4 } }

  /* Inicio */
  .inicio { padding-top: 4vh; display: grid; gap: 22px; }
  .inicio h2 { margin: 0; font: 800 clamp(32px, 5vw, 46px)/1.05 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.02em; max-width: 16ch; }
  .inicio .lema { margin: 0; color: var(--suave); max-width: 56ch; font-size: 18px; }
  .principio { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--hoja); border: 1px solid var(--linea); border-radius: 16px; overflow: hidden; }
  .principio div { padding: 14px 16px; font-size: 15px; color: var(--suave); }
  .principio div + div { border-left: 1px solid var(--linea); }
  .principio b { display: block; color: var(--tinta); font: 700 17px/1.3 "Bricolage Grotesque", system-ui, sans-serif; margin-bottom: 2px; }
  .ejemplos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .ejemplo { text-align: left; background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
  .ejemplo:hover { border-color: var(--tinta); }
  .ejemplo .tema { font: 700 15px/1.2 "Bricolage Grotesque", system-ui, sans-serif; color: var(--suave); }
  .ejemplo .q { font-size: 16px; }

  form { padding: 14px 28px 22px; }
  .caja { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; background: var(--hoja); border: 2px solid var(--linea); border-radius: 16px; padding: 7px 7px 7px 16px; }
  .caja:focus-within { border-color: var(--tinta); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; font: inherit; background: transparent; color: var(--tinta); padding: 8px 0; min-height: 40px; max-height: 150px; }
  .enviar { align-self: flex-end; background: var(--tinta); color: var(--papel); font-weight: 700; padding: 9px 18px; border-radius: 11px; }
  .enviar:disabled { opacity: .5; cursor: default; }
  .aviso-form { max-width: 760px; margin: 8px auto 0; font-size: 13px; color: var(--suave); text-align: center; }

  /* Rastro */
  aside { border-left: 1px solid var(--linea); background: var(--hoja); overflow-y: auto; padding: 26px 24px; }
  aside h3 { margin: 0 0 4px; font: 800 20px/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
  aside .sub { margin: 0 0 20px; font-size: 14px; color: var(--suave); }
  .pasos { list-style: none; margin: 0; padding: 0; display: grid; }
  .paso { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding-bottom: 18px; position: relative; }
  .paso::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--linea); }
  .paso:last-child::before { display: none; }
  .paso .marca-paso { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 14px/1 "Bricolage Grotesque", system-ui, sans-serif; background: var(--panel); color: var(--suave); }
  .paso.hecho .marca-paso { background: var(--tinta); color: var(--papel); }
  .paso.alerta .marca-paso { background: var(--rojo); color: #fff; }
  .paso.ok .marca-paso { background: var(--verde); color: #fff; }
  .paso b { display: block; font-size: 16px; }
  .paso span { font-size: 14px; color: var(--suave); }
  .ficha { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; border-top: 1px solid var(--linea); padding-top: 16px; }
  .ficha dt { color: var(--suave); }
  .ficha dd { margin: 0; }
  .detalle-tecnico { margin-top: 16px; font-size: 13px; }
  .detalle-tecnico summary { cursor: pointer; color: var(--suave); }
  .detalle-tecnico pre { white-space: pre-wrap; word-break: break-word; background: var(--papel); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; }
  .rastro-vacio { color: var(--suave); font-size: 15px; }

  .anim .paso { animation: entra .35s ease-out both; }
  .anim .paso:nth-child(2) { animation-delay: .12s; } .anim .paso:nth-child(3) { animation-delay: .24s; } .anim .paso:nth-child(4) { animation-delay: .36s; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .rastro-movil { display: none; }

  @media (max-width: 960px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 100vh; }
    main, .columna { min-width: 0; max-width: 100%; }
    aside { display: none; }
    .rastro-movil { display: block; background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; }
    .rastro-movil[hidden] { display: none; }
    #log { padding: 20px 16px 8px; }
    form { padding: 10px 16px 16px; }
    header { padding: 12px 16px; flex-wrap: wrap; }
    .modelo { display: none; }
    .principio { grid-template-columns: 1fr; }
    .principio div + div { border-left: 0; border-top: 1px solid var(--linea); }
    .ejemplos { grid-template-columns: 1fr; }
    .fb { margin-left: 0; }
    .barra { grid-template-columns: 1fr auto; row-gap: 4px; }
    .barra .pista { grid-column: 1 / -1; grid-row: 2; }
    .cifra { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .anim .paso, .esperando .punto { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="marca"><div class="gota" aria-hidden="true"></div><h1>Copiloto Brío</h1></div>
    <span class="sintetico" title="La tabla de ventas y los estudios son sintéticos, creados para la prueba">Datos de demostración</span>
    <span class="espacio"></span>
    <span class="modelo" id="modelo"></span>
    <button class="nueva" id="nueva" type="button">Nueva conversación</button>
  </header>

  <main>
    <div id="log" aria-live="polite"><div class="columna" id="columna"></div></div>
    <form id="form">
      <div class="caja">
        <textarea id="input" rows="1" aria-label="Tu pregunta" placeholder="Pregunta por ventas, canales, regiones o estudios de Brío"></textarea>
        <button class="enviar" id="enviar" type="submit">Preguntar</button>
      </div>
      <p class="aviso-form">Las cifras salen de la base única de ventas. Tú decides qué usar.</p>
    </form>
  </main>

  <aside id="rastro" aria-label="Cómo se obtuvo la respuesta">
    <h3>Cómo se obtuvo</h3>
    <p class="sub">Elige una respuesta para ver su rastro.</p>
    <div id="rastro-cuerpo"><p class="rastro-vacio">Aquí verás qué se consultó, de dónde salió cada cifra y si todas pasaron la revisión.</p></div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id)
const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
}
let sessionId = store.get("sessionId") || crypto.randomUUID()
store.set("sessionId", sessionId)
let accessKey = store.get("accessKey") || ""
let turno = 0
const respuestas = []

const EJEMPLOS = [
  { tema: "Cuánto vendimos", q: "¿Cuánto vendió Brío en ventas netas en el tercer trimestre de 2026 frente al mismo trimestre de 2025?" },
  { tema: "Dónde caímos", q: "¿Qué región cayó más en el tercer trimestre de 2026?" },
  { tema: "Por qué no cuadran los reportes", q: "¿Por qué el reporte de Comercial y el de Finanzas dan cifras distintas de ventas netas en 2025?" },
  { tema: "Qué dicen los estudios", q: "¿Qué dicen los estudios internos sobre el precio en el canal tradicional?" },
]
const METRICA = { ventas_netas: "Ventas netas", ventas_brutas: "Ventas brutas", descuentos: "Descuentos", devoluciones: "Devoluciones", unidades: "Unidades", descuento_pct: "Descuento sobre ventas brutas" }
const AGRUP = { total: "total", mes: "por mes", trimestre: "por trimestre", anio: "por año", canal: "por canal", region: "por región" }
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"]
const mes = (m) => (m ? `${MESES[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}` : "")
const periodo = (d, h) => (d === h ? mes(d) : `${mes(d)} a ${mes(h)}`)

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(accessKey ? { "x-access-key": accessKey } : {}) }
  const res = await fetch(path, { ...opts, headers })
  if (res.status === 401) {
    accessKey = prompt("Este copiloto requiere una clave de acceso:") || ""
    store.set("accessKey", accessKey)
    if (accessKey) return api(path, opts)
  }
  return res
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c])

function md(texto) {
  const inline = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "$1")
  const out = []
  let lista = null
  const cerrar = () => { if (lista) { out.push(`<ul>${lista.join("")}</ul>`); lista = null } }
  for (const linea of String(texto).split("\n")) {
    const m = linea.match(/^\s*[-*•]\s+(.*)/) || linea.match(/^\s*\d+[.)]\s+(.*)/)
    if (m) { (lista ||= []).push(`<li>${inline(m[1])}</li>`); continue }
    cerrar()
    if (/^\s*-{3,}\s*$/.test(linea) || !linea.trim()) continue
    const esFuente = /^\s*fuente:/i.test(linea)
    out.push(`<p${esFuente ? ' class="fuente"' : ""}>${inline(linea.replace(/^#+\s*/, ""))}</p>`)
  }
  cerrar()
  return out.join("")
}

const datos = (t) => (t && t.ok && t.resultado && t.resultado.data) || null
const ICONO_OK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
const ICONO_MAL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v6M8 12.5v.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'

// La cifra destacada se arma con el resultado de la herramienta, no con el texto del modelo.
function cifraHtml(toolCalls) {
  let html = ""
  for (const t of toolCalls || []) {
    const d = datos(t)
    if (!d) continue
    if (t.nombre === "brio_consultar_ventas") {
      const tot = d.total
      const var_ = tot.variacion_fmt ? `<span class="variacion ${tot.variacion_fmt.startsWith("-") ? "baja" : "sube"}">${esc(tot.variacion_fmt.replace("-", "−"))}</span>` : ""
      const filtros = [d.filtros.canal && `canal ${d.filtros.canal}`, d.filtros.region && `región ${d.filtros.region}`].filter(Boolean).join(", ")
      let barras = ""
      if (d.filas.length > 1) {
        const usaVar = d.filas.every((f) => typeof f.variacion === "number")
        const max = Math.max(...d.filas.map((f) => Math.abs(usaVar ? f.variacion : f.valor))) || 1
        const peor = usaVar ? d.filas.reduce((a, b) => (b.variacion < a.variacion ? b : a)) : null
        barras = `<div class="barras">${d.filas.map((f) => {
          const v = usaVar ? f.variacion : f.valor
          return `<div class="barra${peor && f === peor && f.variacion < 0 ? " peor" : ""}"><span>${esc(f.grupo)}</span>
            <span class="pista"><span class="relleno" style="width:${Math.max(3, (Math.abs(v) / max) * 100)}%;display:block"></span></span>
            <span class="val">${usaVar ? `<b>${esc(f.variacion_fmt.replace("-", "−"))}</b> · ${esc(f.valor_fmt)}` : `<b>${esc(f.valor_fmt)}</b>`}</span></div>`
        }).join("")}</div>`
      }
      html += `<div class="cifra">
        <div class="que">${esc(METRICA[d.metrica] || d.metrica)} de Brío · ${esc(periodo(d.periodo.desde, d.periodo.hasta))}${filtros ? ` · ${esc(filtros)}` : ""}</div>
        <div class="fila"><span class="numero">${esc(tot.valor_fmt)}</span>${var_}</div>
        ${tot.comparado_fmt ? `<div class="contra">Frente a ${esc(tot.comparado_fmt)} en ${esc(periodo(d.periodo_comparado.desde, d.periodo_comparado.hasta))}</div>` : ""}
        ${barras}
      </div>`
    }
    if (t.nombre === "brio_definicion" && d.comparacion) {
      const max = Math.max(...d.comparacion.map((c) => c.valor))
      html += `<div class="cifra"><div class="que">Ventas netas según cada reporte · ${esc(periodo(d.periodo.desde, d.periodo.hasta))}</div>
        <div class="barras">${d.comparacion.map((c) => `<div class="barra${c.id === "finanzas" ? "" : " peor"}"><span>${esc(c.reporte.replace(" (definición única)", ""))}</span>
          <span class="pista"><span class="relleno" style="width:${(c.valor / max) * 100}%;display:block;${c.id === "finanzas" ? "background:var(--verde)" : ""}"></span></span>
          <span class="val"><b>${esc(c.valor_fmt)}</b>${c.id === "finanzas" ? " · la única" : ` · ${esc(c.diferencia_pct_fmt)}`}</span></div>`).join("")}</div>
        <div class="contra">Definición única: ${esc(d.definicion_unica.formula)}</div></div>`
    }
    if (t.nombre === "brio_buscar_estudios") {
      html += d.fragmentos.map((f) => `<div class="cita"><q>${esc(f.texto)}</q><small>${esc(f.estudio)}, sección ${esc(f.seccion)}</small></div>`).join("")
    }
  }
  return html
}

function selloHtml(v) {
  if (!v || !v.cifras) return ""
  if (!v.no_verificadas.length) return `<span class="sello ok">${ICONO_OK}${v.cifras === 1 ? "1 cifra verificada" : `${v.verificadas} de ${v.cifras} cifras verificadas`}</span>`
  return `<span class="sello mal">${ICONO_MAL}Revisa: ${esc(v.no_verificadas.join(", "))} sin respaldo en los datos</span>`
}

function rastroHtml(ev) {
  const calls = ev.toolCalls || []
  const consultas = calls.map((t) => {
    const a = t.args || {}
    if (t.nombre === "brio_consultar_ventas") {
      const comp = a.comparar_con === "mismo_periodo_anio_anterior" ? ", frente al año anterior" : a.comparar_con === "periodo_anterior" ? ", frente al periodo anterior" : ""
      const filtros = [a.canal && `canal ${a.canal}`, a.region && `región ${a.region}`].filter(Boolean).join(", ")
      return `${METRICA[a.metrica] || a.metrica}, ${periodo(a.desde, a.hasta)}, ${AGRUP[a.agrupar_por || "total"]}${filtros ? `, ${filtros}` : ""}${comp}`
    }
    if (t.nombre === "brio_definicion") return `Definición de ventas netas${a.comparar_desde ? `, comparando reportes de ${periodo(a.comparar_desde, a.comparar_hasta)}` : ""}`
    if (t.nombre === "brio_buscar_estudios") return `Estudios internos sobre “${a.consulta}”`
    return "Alcance de los datos disponibles"
  })
  const fallas = calls.filter((t) => !t.ok)
  const ficha = calls.map(datos).find((d) => d && d.ficha)?.ficha
  const v = ev.verificacion || { cifras: 0, verificadas: 0, no_verificadas: [] }
  const revision = !v.cifras ? { cls: "hecho", txt: "La respuesta no trae cifras para revisar" }
    : v.no_verificadas.length ? { cls: "alerta", txt: `${v.no_verificadas.length} cifra(s) sin respaldo: no las uses sin revisar` }
    : { cls: "ok", txt: `${v.verificadas} de ${v.cifras} cifras coinciden con los datos` }
  return `<ol class="pasos">
    <li class="paso hecho"><span class="marca-paso">1</span><div><b>Entendió tu pregunta</b><span>${calls.length ? "Decidió qué consultar en la base" : "Respondió sin consultar la base"}</span></div></li>
    <li class="paso ${calls.length ? (fallas.length === calls.length ? "alerta" : "hecho") : ""}"><span class="marca-paso">2</span><div><b>Consultó</b><span>${consultas.length ? consultas.map(esc).join("<br>") : "Sin consultas"}</span></div></li>
    <li class="paso ${calls.length ? "hecho" : ""}"><span class="marca-paso">3</span><div><b>La base hizo las cuentas</b><span>${fallas.length ? esc(fallas.map((f) => f.resumen).join(" ")) : "La IA no calcula: copia lo que la base devuelve"}</span></div></li>
    <li class="paso ${revision.cls}"><span class="marca-paso">4</span><div><b>Revisión de cifras</b><span>${esc(revision.txt)}</span></div></li>
  </ol>
  ${ficha ? `<dl class="ficha"><dt>Fuente</dt><dd>Base única de ventas de Brío</dd><dt>Corte</dt><dd>${esc(ficha.corte)}</dd><dt>Definición</dt><dd>${esc(ficha.metrica)} = ${esc(ficha.definicion)}</dd><dt>Valida</dt><dd>${esc(ficha.responsable_validacion)}</dd><dt>Consulta</dt><dd>${esc(ficha.consulta_id)}</dd></dl>` : ""}
  ${calls.length ? `<details class="detalle-tecnico"><summary>Detalle técnico</summary>${calls.map((t) => `<pre>${esc(t.nombre + "\n" + JSON.stringify(t.args, null, 2))}</pre>`).join("")}</details>` : ""}`
}

function mostrarRastro(i, animar) {
  const ev = respuestas[i]
  if (!ev) return
  document.querySelectorAll(".respuesta").forEach((n) => n.classList.toggle("activa", Number(n.dataset.i) === i))
  const cuerpo = $("rastro-cuerpo")
  cuerpo.innerHTML = rastroHtml(ev)
  cuerpo.classList.toggle("anim", !!animar)
  $("rastro").querySelector(".sub").textContent = "Respuesta " + (i + 1)
}

function agregar(ev, animar) {
  const div = document.createElement("div")
  if (ev.rol === "usuario") {
    div.className = "pregunta"
    div.textContent = ev.texto
  } else {
    const i = respuestas.push(ev) - 1
    const idx = ++turno
    div.className = "respuesta" + (ev.error ? " error" : "")
    div.dataset.i = i
    div.innerHTML = `<div class="texto">${md(ev.texto || "")}</div>${cifraHtml(ev.toolCalls)}
      <div class="pie">${selloHtml(ev.verificacion)}
        ${ev.error ? "" : `<button type="button" class="ver-rastro">Cómo se obtuvo</button>
        <span class="fb"><button type="button" data-u="1" aria-pressed="false">Me sirvió</button><button type="button" data-u="0" aria-pressed="false">Tiene un error</button></span>`}
      </div>
      <div class="rastro-movil" hidden></div>`
    const rm = div.querySelector(".rastro-movil")
    div.querySelector(".ver-rastro")?.addEventListener("click", () => {
      mostrarRastro(i, true)
      if (window.matchMedia("(max-width: 960px)").matches) {
        rm.hidden = !rm.hidden
        rm.innerHTML = rm.hidden ? "" : rastroHtml(ev)
      }
    })
    div.querySelectorAll(".fb button").forEach((b) => {
      b.onclick = async () => {
        div.querySelectorAll(".fb button").forEach((x) => x.setAttribute("aria-pressed", "false"))
        b.setAttribute("aria-pressed", "true")
        const util = b.dataset.u === "1"
        const comentario = util ? "" : (prompt("¿Qué estaba mal? Nos ayuda a corregirlo.") || "")
        try { await api("/api/feedback", { method: "POST", body: JSON.stringify({ sessionId, indice: idx, util, comentario }) }) } catch {}
      }
    })
    if (!ev.error) mostrarRastro(i, animar)
  }
  $("columna").appendChild(div)
  $("log").scrollTop = $("log").scrollHeight
}

function mostrarInicio() {
  const div = document.createElement("div")
  div.className = "inicio"
  div.id = "inicio"
  div.innerHTML = `<h2>Pregúntale a las ventas de Brío</h2>
    <p class="lema">Escribe como se lo preguntarías a un colega. Recibes la cifra, de dónde salió y si pasó la revisión.</p>
    <div class="principio">
      <div><b>Una sola cifra</b>Ventas netas = brutas − descuentos − devoluciones</div>
      <div><b>La IA no hace cuentas</b>Las hace la base única de ventas</div>
      <div><b>Cada cifra se revisa</b>Si algo no tiene respaldo, te avisa</div>
    </div>
    <div class="ejemplos">${EJEMPLOS.map((e) => `<button class="ejemplo" type="button" data-q="${esc(e.q)}"><span class="tema">${esc(e.tema)}</span><span class="q">${esc(e.q)}</span></button>`).join("")}</div>`
  div.querySelectorAll(".ejemplo").forEach((b) => (b.onclick = () => enviar(b.dataset.q)))
  $("columna").appendChild(div)
}

let ocupado = false
async function enviar(texto) {
  if (ocupado || !texto.trim()) return
  ocupado = true
  $("enviar").disabled = true
  $("inicio")?.remove()
  agregar({ rol: "usuario", texto })
  const espera = document.createElement("div")
  espera.className = "esperando"
  const inicio = Date.now()
  const pintar = () => { espera.innerHTML = `<span class="punto"></span>Consultando la base de ventas… ${Math.round((Date.now() - inicio) / 1000)} s` }
  pintar()
  const reloj = setInterval(pintar, 1000)
  $("columna").appendChild(espera)
  $("log").scrollTop = $("log").scrollHeight
  try {
    const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ sessionId, message: texto }) })
    const data = await res.json()
    if (!res.ok) agregar({ rol: "asistente", texto: data.error || "El servidor no pudo procesar la pregunta. Vuelve a enviarla.", error: true })
    else agregar({ rol: "asistente", texto: data.reply, toolCalls: data.toolCalls, verificacion: data.verificacion, error: data.error }, true)
  } catch {
    agregar({ rol: "asistente", texto: "No hay conexión con el servidor. Revisa tu conexión y vuelve a enviar la pregunta.", error: true })
  } finally {
    clearInterval(reloj)
    espera.remove()
    ocupado = false
    $("enviar").disabled = false
    $("input").focus()
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; enviar(t) }
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit() } })
$("nueva").onclick = () => { store.set("sessionId", crypto.randomUUID()); location.reload() }

async function iniciar() {
  try {
    const h = await (await fetch("/api/health")).json()
    $("modelo").textContent = h.llm_configurado ? `Modelo: ${h.model}` : "Modelo no configurado"
  } catch { $("modelo").textContent = "Sin conexión" }
  let historial = []
  try {
    const rs = await api(`/api/sessions/${sessionId}`)
    if (rs.ok) historial = (await rs.json()).historial
  } catch {}
  if (!historial.length) mostrarInicio()
  historial.forEach((ev) => agregar(ev, false))
}
iniciar()
